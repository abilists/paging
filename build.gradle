plugins {
    id 'java'
    id 'maven-publish'
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
	mavenLocal()
    mavenCentral()
}

version = '0.8'

// gradle publish
publishing {

    publications {
        maven(MavenPublication) {
            groupId = 'io.paging'
            artifactId = 'paging'
            version = project.version
            
            artifact 'build/libs/paging-' + project.version + '.jar'
        }
    }

    repositories {
        maven {
            credentials {
                username = "admin"
                password = "password"
            }
            url = "http://localhost:8081/artifactory/libs-release-local"
            allowInsecureProtocol = true
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': 'Paging', 'Implementation-Version': project.version)
    }
}

dependencies {
	testImplementation 'junit:junit:4.+'
	testImplementation "org.junit.jupiter:junit-jupiter-api:5.12.1"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.12.1"
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// To install this jar into localhost
// gradle publishToMavenLocal like gradle install